<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Philly DJ Sets</title>
  <meta name="description" content="Upcoming DJ sets in Philadelphia.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f4f0;
      --surface: #ffffff;
      --text: #16141a;
      --muted: #6b6672;
      --border: #e3dfe8;
      --accent: #c2186b;
      --accent-soft: #fbe3ef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0d13;
        --surface: #1a1720;
        --text: #f2eff6;
        --muted: #a39eac;
        --border: #2d2836;
        --accent: #ff4fa3;
        --accent-soft: #3a1729;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Space Grotesk", system-ui, sans-serif;
      line-height: 1.45;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    header h1 { font-size: clamp(2rem, 7vw, 3.2rem); margin: 0; letter-spacing: -0.02em; }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); margin: 8px 0 24px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .controls input, .controls select {
      font: inherit; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    }
    .controls input { flex: 1 1 220px; min-width: 0; }
    .controls select { flex: 0 1 200px; }
    .day h2 {
      font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin: 28px 0 10px;
    }
    .event {
      display: block; text-decoration: none; color: inherit;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; margin-bottom: 10px; transition: border-color .15s;
    }
    .event:hover { border-color: var(--accent); }
    .event .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .event h3 { margin: 0; font-size: 1.15rem; }
    .event .time { color: var(--muted); white-space: nowrap; font-size: 0.9rem; }
    .event .venue { margin-top: 2px; color: var(--muted); }
    .event .djs { margin-top: 8px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; font-size: 0.78rem; }
    .tag { background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 999px; }
    .tag.src { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .note { margin-top: 8px; font-size: 0.85rem; color: var(--muted); font-style: italic; }
    .empty { color: var(--muted); text-align: center; padding: 48px 0; }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.85rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Philly <span>DJ Sets</span></h1>
      <p>Upcoming DJ nights around Philadelphia. Check the listing before you go, because dates and lineups change.</p>
    </header>

    <div class="controls">
      <input id="q" type="search" placeholder="Search DJ, venue, genre…" aria-label="Search">
      <select id="venue" aria-label="Venue"><option value="">All venues</option></select>
    </div>

    <main id="list"></main>

    <footer>
      Know of a set that's missing? Add it to <code>events.js</code> or open an issue on the repo.
    </footer>
  </div>

  <script src="events.js"></script>
  <script>
    const list = document.getElementById("list");
    const q = document.getElementById("q");
    const venueSel = document.getElementById("venue");

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const parse = d => { const [y, m, day] = d.split("-").map(Number); return new Date(y, m - 1, day); };

    const upcoming = (window.EVENTS || [])
      .filter(e => parse(e.date) >= today)
      .sort((a, b) => a.date.localeCompare(b.date));

    [...new Set(upcoming.map(e => e.venue))].sort().forEach(v => {
      const o = document.createElement("option");
      o.value = o.textContent = v;
      venueSel.append(o);
    });

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmtDay = d => parse(d).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });

    function render() {
      const term = q.value.trim().toLowerCase();
      const venue = venueSel.value;
      const shown = upcoming.filter(e =>
        (!venue || e.venue === venue) &&
        (!term || [e.title, e.venue, e.genre, ...(e.djs || [])].join(" ").toLowerCase().includes(term))
      );

      if (!shown.length) {
        list.innerHTML = '<p class="empty">No upcoming sets match.</p>';
        return;
      }

      const byDay = {};
      shown.forEach(e => (byDay[e.date] ||= []).push(e));

      list.innerHTML = Object.entries(byDay).map(([day, evs]) => `
        <section class="day">
          <h2>${fmtDay(day)}</h2>
          ${evs.map(e => `
            <a class="event" href="${esc(e.url)}" target="_blank" rel="noopener">
              <div class="top">
                <h3>${esc(e.title)}</h3>
                ${e.time ? `<span class="time">${esc(e.time)}</span>` : ""}
              </div>
              <div class="venue">${esc(e.venue)}</div>
              ${e.djs && e.djs.length ? `<div class="djs">${e.djs.map(esc).join(" · ")}</div>` : ""}
              ${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}
              <div class="tags">
                ${e.genre ? `<span class="tag">${esc(e.genre)}</span>` : ""}
                ${e.source ? `<span class="tag src">via ${esc(e.source)}</span>` : ""}
              </div>
            </a>`).join("")}
        </section>`).join("");
    }

    q.addEventListener("input", render);
    venueSel.addEventListener("change", render);
    render();
  </script>
</body>
</html>
